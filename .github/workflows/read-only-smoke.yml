name: Read-only public smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm read-only:check
      - run: pnpm market:record --duration-seconds 30
      - name: Find run directory
        id: find-run
        run: |
          set -euo pipefail
          RUN_DIR=$(find data/polymarket-runs -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ -z "$RUN_DIR" ]; then
            echo "No run directory found" >&2
            exit 1
          fi
          echo "run_directory=$RUN_DIR" >> "$GITHUB_OUTPUT"
      - name: Verify run is usable for replay
        run: pnpm market:verify-run "${{ steps.find-run.outputs.run_directory }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-read-only-smoke-run
          path: data/polymarket-runs/
          if-no-files-found: warn
          retention-days: 7
