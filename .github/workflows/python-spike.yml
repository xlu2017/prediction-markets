name: Python spike (Nautilus replay)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies from lock file
        run: uv sync --frozen --extra dev
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src
      - name: Unit tests
        run: uv run python -m pytest tests -q
      - name: Fixture conversion
        run: |
          uv run python -m prediction_markets_nautilus.convert \
            --run-directory ../fixtures/sample-run \
            --catalog-directory .artifacts/nautilus-catalog
      - name: Two independent deterministic replays with hash comparison
        run: |
          uv run python -m prediction_markets_nautilus.replay \
            --catalog-directory .artifacts/nautilus-catalog --output .artifacts/replay-1.json
          uv run python -m prediction_markets_nautilus.replay \
            --catalog-directory .artifacts/nautilus-catalog --output .artifacts/replay-2.json
          uv run python - <<'PY'
          import json
          a = json.load(open(".artifacts/replay-1.json", encoding="utf-8"))
          b = json.load(open(".artifacts/replay-2.json", encoding="utf-8"))
          ra, rb = a["replay"], b["replay"]
          keys = ["inputStreamHash", "finalUpBookHash", "finalDownBookHash",
                  "referenceStreamHash", "strategyVisibleStreamHash", "orderIntentStreamHash"]
          assert all(ra[k] == rb[k] for k in keys), "replay hashes differ across runs"
          assert ra["upBookAfterEachEvent"] == rb["upBookAfterEachEvent"]
          assert ra["downBookAfterEachEvent"] == rb["downBookAfterEachEvent"]
          assert a["finalBookComparison"]["allMatch"] is True, "final-book comparison failed"
          print("deterministic replay verified: hashes identical and final books match recorder")
          PY
      - name: BacktestNode proof with fills and ordering
        run: |
          uv run python -m prediction_markets_nautilus.backtest \
            --catalog-directory .artifacts/nautilus-catalog --output .artifacts/backtest-proof.json
          uv run python - <<'PY'
          import json
          r = json.load(open(".artifacts/backtest-proof.json", encoding="utf-8"))["backtestProof"]
          assert r["ran"], f"BacktestNode did not run: {r['error']}"
          assert r["bookEventsReceived"] > 0, "no book events"
          assert r["ordersSubmitted"] > 0, "no orders submitted"
          assert r["fillsCount"] > 0, "no fills — crossing order did not match"
          assert r["referenceEventsReceived"] > 0, "no reference events"
          seqs = r["receivedSequences"]
          assert len(seqs) > 0 and seqs == sorted(seqs), f"sequences not in order: {seqs}"
          print("backtest proof verified: fills, references, and recorder ordering confirmed")
          PY
