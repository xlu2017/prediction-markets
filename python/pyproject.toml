[project]
name = "prediction-markets-nautilus"
version = "0.1.0"
description = "Schema-v2 to NautilusTrader adapter and deterministic replay spike for Polymarket research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
private = true

dependencies = [
    "nautilus_trader==1.231.0",
    "pyarrow>=24.0.0",
    "msgspec>=0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_markets_nautilus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Nautilus PyO3 types are opaque; the spike does not require full strict annotation.
warn_return_any = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
